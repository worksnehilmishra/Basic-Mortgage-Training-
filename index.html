button,input{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--navy);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:10}.brand{font-weight:700;font-size:17px;padding:10px 12px 22px}.brand small{display:block;color:#b9c8d8;font-weight:400;font-size:12px;margin-top:3px}.nav button{width:100%;background:transparent;border:0;color:#dbe5ef;text-align:left;padding:11px 12px;border-radius:7px;margin:2px 0}.nav button:hover,.nav button.active{background:#1c3d60;color:#fff}.main{margin-left:250px;width:calc(100% - 250px)}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between;position:sticky;top:0;z-index:5}.mobile-menu{display:none}.content{max-width:1200px;margin:0 auto;padding:28px}.title h1{margin:0;font-size:28px}.title p{margin:5px 0 22px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}.metric{font-size:28px;font-weight:700;margin-top:4px}.muted{color:var(--muted);font-size:13px}.progress{height:8px;background:#e5e9ee;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--blue)}.btn{border:1px solid #c9d2dc;background:#fff;color:#263747;padding:9px 13px;border-radius:7px;font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:hover{filter:brightness(.97)}.actions{display:flex;gap:8px;flex-wrap:wrap}.topic{transition:.15s}.topic:hover{border-color:#a9c5e3;box-shadow:0 2px 10px #13263b0d}.topic h3{margin:0 0 5px}.topic p{margin:0 0 12px;color:var(--muted);font-size:13px}.pill{display:inline-block;border:1px solid #cbd8e5;background:#f5f8fb;border-radius:5px;padding:3px 7px;font-size:11px;color:#536679}.search{width:100%;border:1px solid #cbd5df;border-radius:7px;padding:10px 12px;background:#fff;margin-bottom:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.definition{border-left:3px solid var(--blue);padding:13px 15px;background:#fbfcfe;margin:10px 0;border-radius:0 7px 7px 0}.definition b{display:block;margin-bottom:4px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 11px}.tab.active{background:var(--blue2);border-color:#b9d1ea;color:var(--blue);font-weight:700}.question{font-size:19px;font-weight:650;white-space:pre-line;margin:12px 0 18px}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:13px;margin:7px 0}.option.selected{border-color:var(--blue);background:var(--blue2)}.option.correct{border-color:#59a87b;background:var(--greenbg)}.option.wrong{border-color:#e18c86;background:var(--redbg)}.feedback{padding:12px;border-radius:7px;margin-top:14px;font-size:14px}.feedback.ok{background:var(--greenbg);color:var(--green)}.feedback.bad{background:var(--redbg);color:var(--red)}.flash{min-height:250px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:30px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}.table th,.table td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{background:#f7f9fb;font-size:12px;color:#5c6d7e;text-transform:uppercase;letter-spacing:.04em}.empty{text-align:center;padding:50px;color:var(--muted);border:1px dashed #cbd4de;border-radius:9px;background:#fff}
@media(max-width:800px){.sidebar{display:none}.main{margin-left:0;width:100%}.topbar{padding:0 15px}.mobile-menu{display:block}.content{padding:18px 14px}.grid,.grid2{grid-template-columns:1fr}.title h1{font-size:24px}.card{padding:16px}.table{display:block;overflow:auto;white-space:nowrap}.question{font-size:17px}}

<script>
const DATA = {"topics": [{"id": "basics", "title": "Mortgage Basics", "overview": "What a mortgage is and why borrowers use one.", "concepts": [{"term": "Mortgage", "definition": "A legal agreement between the borrower and the lender."}, {"term": "Purpose of a Mortgage", "definition": "Helps people purchase a home without paying the full amount upfront; the borrower repays the loan through monthly payments over a period."}], "keyPoints": ["Mortgage loans are used to buy a home or to borrow money against the value of a home you already own.", "Borrowers can stay on the property through the tenure of the loan."], "remember": "A mortgage is a legal agreement, not a type of insurance or tax — it lets a borrower buy a home over time instead of paying in full upfront."}, {"id": "loan-types", "title": "Types of Loans", "overview": "The two broad categories of loans, based on collateral.", "concepts": [{"term": "Secured Loan", "definition": "A loan in which the borrower pledges an asset/collateral (such as a car or property) against the loan; the loan amount is usually based on the value of the collateral. The risk sits with the borrower â if they don't repay, the lender can sell the collateral to recover the money."}, {"term": "Unsecured Loan", "definition": "A loan that doesn't require any collateral; lenders approve it based on the borrower's creditworthiness. Examples include personal loans, student loans, and credit cards."}], "keyPoints": ["A mortgage itself is a secured loan â the home is the collateral."], "remember": "Secured = collateral-backed, risk on the borrower. Unsecured = based on creditworthiness only."}, {"id": "parties", "title": "Parties Involved in the Mortgage", "overview": "The four key parties in a mortgage transaction.", "concepts": [{"term": "Lender", "definition": "The person who funds the borrower (lends the borrower the money; the loan)."}, {"term": "Borrower", "definition": "The party who takes the loan and repays it through EMI."}, {"term": "Servicer", "definition": "Helps in loan processing, tracks loan payments, sends notices for missed payments, collects debts, and forecloses the property on default."}, {"term": "Investor", "definition": "Puts money into mortgages to earn a profit; purchases mortgages from lenders. In most U.S. cases these are government entities or government-sponsored enterprises, which lets the lender keep issuing new home loans."}], "keyPoints": [], "remember": "Lender funds it, Borrower repays it, Servicer manages it day-to-day, Investor eventually owns it."}, {"id": "markets", "title": "Types of Mortgage Market", "overview": "Where mortgages are originated versus where they are later bought and sold.", "concepts": [{"term": "Primary Mortgage Market", "definition": "Where the mortgage process begins â borrowers apply for and receive a home loan directly from a primary lender, who evaluates income, credit history, employment, and assets before funding the loan."}, {"term": "Secondary Mortgage Market", "definition": "Where existing mortgage loans and mortgage servicing rights are bought and sold after origination. Lenders sell loans to investors to recover funds and issue new loans; the borrower keeps paying as before, though the servicer may change."}], "keyPoints": [], "remember": "Primary = loan is born. Secondary = loan is later bought and sold; the borrower's payments don't change, only who services it might."}, {"id": "key-terms", "title": "Key Industry Terms", "overview": "Common vocabulary used across the U.S. mortgage industry.", "concepts": [{"term": "Escrow", "definition": "A portion of a homeowner's monthly mortgage payment set aside by the lender/servicer to cover future property taxes and homeowners' insurance, held in an account managed on the borrower's behalf."}, {"term": "County", "definition": "Means district â a territorial division and unit of local government; in the U.S., counties are government units below the state level."}, {"term": "Appraiser", "definition": "A professional who determines the market value of an asset such as property, acting independently of the buying and selling parties."}, {"term": "BPO (Broker Price Opinion)", "definition": "An evaluation/estimate of a property's value used by lenders, mortgage companies, or investors without a full appraisal â commonly used in foreclosure (FC) situations."}, {"term": "SSN (Social Security Number)", "definition": "A 9-digit numerical identifier assigned to U.S. citizens and other residents to track income and determine benefits."}, {"term": "Trustee", "definition": "A government-appointed person appointed for purposes such as bankruptcy or certain retirement plans/pensions, or to manage assets for someone."}, {"term": "Credit Report", "definition": "A statement containing information about your credit activity and current credit situation, such as loan-paying history and the status of your credit accounts."}, {"term": "Date Method", "definition": "The U.S. uses mm-dd-yyyy (month written first); most other countries use dd-mm-yyyy (day first)."}, {"term": "Attorney", "definition": "The U.S. term for a lawyer â a person with the legal right to act on someone else's behalf."}, {"term": "Creditor", "definition": "An individual or entity that has lent money to another individual or entity and is owed it back, typically with interest (e.g., a bank lending money to buy a house)."}, {"term": "Debtor", "definition": "An individual or organization that owes money â someone who has taken a loan from a bank or lender."}, {"term": "Registered Mail", "definition": "A postal service that gives the sender proof of mailing via a receipt."}, {"term": "Un-registered Mail", "definition": "Mail with no proof that it was sent or received."}], "keyPoints": [], "remember": "Creditor is owed money; Debtor owes money. Registered mail has proof of mailing — un-registered does not."}, {"id": "emi-piti", "title": "EMI and PITI", "overview": "The fixed monthly payment and its four components.", "concepts": [{"term": "EMI (Equated Monthly Installment)", "definition": "The fixed monthly payment a borrower makes to the lender to repay the home loan. It is made up of four elements â PITI."}, {"term": "Principal", "definition": "The portion of the payment that goes toward paying down the original loan amount. As it's paid down, the balance decreases, reducing the total interest paid over the loan's life."}, {"term": "Interest", "definition": "The cost of borrowing money, calculated on the outstanding principal. Early in the loan more of the payment goes to interest; later, more goes to principal."}, {"term": "Taxes (in PITI)", "definition": "Property taxes assessed by local governments; many lenders hold these funds in an escrow account and pay them when due."}, {"term": "Insurance (in PITI)", "definition": "Typically homeowners insurance and, if applicable, mortgage insurance (PMI, required when the down payment is under 20%); often collected monthly and held in escrow."}], "keyPoints": ["PITI = Principal + Interest + Taxes + Insurance."], "remember": "PITI is the acronym for the four pieces that make up an EMI: Principal, Interest, Taxes, Insurance."}, {"id": "rate-types", "title": "Fixed-Rate vs Adjustable-Rate Mortgages", "overview": "The two ways a mortgage interest rate can behave over the loan term.", "concepts": [{"term": "Fixed-Rate Mortgage", "definition": "Has a constant interest rate for the entire life of the loan, giving predictable, fixed monthly payments. Common terms are 15, 20, or 30 years."}, {"term": "Adjustable-Rate Mortgage (ARM)", "definition": "Has an interest rate that changes periodically, adjusted to follow market interest rates. Typically starts lower than a fixed rate but can increase over time, raising monthly payments."}], "keyPoints": [], "remember": "Fixed = secure and predictable. ARM = usually starts lower, but can rise with the market."}, {"id": "products", "title": "Mortgage Products", "overview": "The different mortgage structures and government-backed programs described in the notes.", "concepts": [{"term": "Forward Mortgage", "definition": "Money borrowed to purchase a home; the borrower pays the lender monthly (EMI) until the full amount is paid, and the lender holds the property until then."}, {"term": "Interest-Only Mortgage", "definition": "Only interest is paid for a specific period; the principal is paid later, either as a lump sum or in subsequent payments."}, {"term": "Conventional Loan", "definition": "A mortgage not backed by the federal government. Typically requires a minimum 620 credit score and in-depth income, employment, credit, asset, and debt documentation â harder to qualify for than government-backed loans."}, {"term": "HELOC (Home Equity Line of Credit)", "definition": "A variable-rate loan that works like a credit card, letting the borrower draw on part of a pre-approved amount from the bank."}, {"term": "Reverse Mortgage", "definition": "Homeowners (62+) borrow against their home's value and receive a lump sum or fixed monthly payment; the bank gains rights to the property once the borrower passes away. The borrower must live in the property as their primary residence. Foreclosure can result from Death, Non-Occupancy, or Tax and Insurance issues."}, {"term": "VA Loan", "definition": "A mortgage guaranteed (not directly funded) by the U.S. Department of Veterans Affairs. A private lender provides the loan and the VA guarantees a portion of it, reducing the lender's risk â available to eligible veterans, active-duty service members, and certain military families, often with no down payment and no monthly mortgage insurance."}, {"term": "FHA Loan", "definition": "A mortgage insured by the Federal Housing Administration, provided by an FHA-approved lender, designed to help first-time buyers or those with limited savings/modest credit qualify. Allows a down payment as low as 3.5% but generally requires upfront (UFMIP) and monthly (MIP) mortgage insurance; the home must be the borrower's primary residence."}], "keyPoints": [], "remember": ""}, {"id": "refinance", "title": "Refinance", "overview": "Replacing an existing mortgage with a new one.", "concepts": [{"term": "Refinance (Refi)", "definition": "The process of replacing an existing mortgage loan with a new mortgage loan. The new loan pays off the current one, and the borrower continues payments under the new loan's terms."}], "keyPoints": ["Reasons to refinance: obtain better loan terms, reduce monthly payments, access home equity (cash-out refinance), shorten or extend the loan term, or change the type of mortgage.", "How it works: borrower has an existing mortgage â applies for a new loan (same or different lender) â new lender approves â new loan pays off the old one â borrower pays the new loan under its terms."], "remember": "Refinancing replaces the old loan with a new one — the borrower's ongoing obligation is now to the new loan's terms."}, {"id": "title-insurance", "title": "Title Insurance", "overview": "A one-time policy protecting ownership of the property.", "concepts": [{"term": "Title Insurance", "definition": "A one-time insurance policy bought during the home-buying process that protects the homebuyer and/or lender against financial losses from ownership disputes, liens, or hidden title defects that existed before the purchase; ensures the buyer receives clear ownership."}], "keyPoints": ["Protects against: another person claiming ownership, forged signatures on legal documents, fraudulent property transfers, unknown heirs claiming ownership, and unpaid property taxes or contractor liens not discovered before the sale."], "remember": "Title insurance is a one-time purchase, not a recurring premium — it guards against problems with ownership history."}, {"id": "documents", "title": "Mortgage / Foreclosure Documents", "overview": "The core legal documents used in a mortgage transaction.", "concepts": [{"term": "Mortgage / Deed of Trust", "definition": "A written document, also called a Mortgage Agreement, that officially recognizes a legally binding relationship between the Borrower and the Lender."}, {"term": "Note / Endorsed Note / Allonge", "definition": "A promissory note â a written promise by the issuer to pay back another party."}, {"term": "Assignment of Mortgage (AOM)", "definition": "Gives the loan seller's rights under the mortgage â including the right to foreclose if the borrower defaults â to the new owner of the loan, when a loan is assigned from one lender to another."}, {"term": "Loan Agreement", "definition": "A legal document between borrower and lender outlining the mortgage loan terms; differs from a standard loan agreement because the collateral is real estate and personal property."}], "keyPoints": [], "remember": "Deed of Trust = the relationship; Note = the promise to pay; AOM = the transfer of rights between lenders."}, {"id": "foreclosure", "title": "Foreclosure", "overview": "What happens when a borrower defaults on their mortgage.", "concepts": [{"term": "Foreclosure", "definition": "The legal process in which the lender attempts to recover the balance of a loan from a borrower who fails to pay, through the sale of the property. Foreclosure action is initiated when the borrower defaults on 3 continuous EMIs."}, {"term": "Judicial Foreclosure", "definition": "Foreclosure proceedings that take place through the court system."}, {"term": "Non-Judicial Foreclosure", "definition": "Foreclosure that doesn't go through court, though the lender must still follow legally required steps. This process typically goes more quickly than a Judicial Foreclosure."}], "keyPoints": ["Foreclosure and bankruptcy both impact the borrower's credit score."], "remember": "3 missed continuous EMIs triggers foreclosure. Judicial = through court (slower). Non-Judicial = no court (faster)."}, {"id": "bankruptcy", "title": "Bankruptcy", "overview": "The legal process for borrowers unable to repay their debts.", "concepts": [{"term": "Bankruptcy", "definition": "A legal proceeding initiated when a person or business is unable to repay outstanding debts; offers a fresh start to people who can no longer afford their bills by filing a petition with the court to avoid foreclosure or other creditor action."}], "keyPoints": ["Provides for the reduction or elimination of certain debts, and a timeline for repaying non-dischargeable debts.", "Permits repayment of secured debt (real estate, vehicles, etc. pledged as collateral), often on terms more favorable to the debtor.", "All U.S. bankruptcy cases go through federal courts; a bankruptcy judge decides eligibility and discharge.", "Filed when a company or individual faces hardship and can't control their debts."], "remember": "Bankruptcy is filed in federal court and can reduce, eliminate, or restructure debt — it's a legal fresh start, not automatic debt forgiveness."}, {"id": "lifecycle", "title": "The Mortgage Loan Life Cycle", "overview": "The six stages a loan moves through, from application to servicing.", "concepts": [{"term": "Origination", "definition": "The initial step where the borrower submits a loan application (Form 1003 â the Uniform Residential Loan Application, or its equivalent Form 65). The loan officer gathers documentation and evaluates the borrower's financial profile."}, {"term": "Processing", "definition": "Follows origination. The processor collects documents (pay stubs, tax returns, bank statements, ID, employment proof), enters data, verifies information (employer contact, bank statement verification, credit report check), reviews the application for completeness, runs quality control, prepares the file for underwriting, and communicates with the borrower for any extra documentation."}, {"term": "Underwriting", "definition": "The lender assesses lending risk and decides to approve or deny the loan. Includes a property appraisal, risk assessment (creditworthiness and Debt-to-Income Ratio/DTI), a decision, an issued decision letter, and collaboration with the processor on any approval conditions."}, {"term": "Closing and Funding", "definition": "Finalizing the loan: preparing closing documents (Deed of Trust/mortgage document, promissory note/allonge, loan agreement, closing disclosure), signing documents at the closing meeting, paying closing costs (origination, appraisal, escrow fees), disbursing funds (typically to the seller or title company), and confirming funding to all parties."}, {"term": "Post Closing", "definition": "The completed loan file is reviewed for accuracy, completeness, and compliance with investor/regulatory requirements; deficiencies are resolved and the file is finalized and prepared for servicing or sale in the secondary market."}, {"term": "Servicing", "definition": "The servicer manages the loan after closing: collecting monthly payments, applying them to principal/interest/taxes/insurance, managing the escrow account, maintaining records and statements, handling customer service, managing delinquent loans and loss mitigation options, and processing payoffs."}], "keyPoints": ["Order: Origination â Processing â Underwriting â Closing & Funding â Post Closing â Servicing."], "remember": "Six stages, always in this order: Origination, Processing, Underwriting, Closing & Funding, Post Closing, Servicing."}], "abbreviations": [{"code": "FLDD", "full": "First Legal Due Date", "meaning": "First Legal Due Date â a foreclosure-timeline term from the abbreviations list."}, {"code": "RDDD", "full": "Reasonable Due Diligence Date", "meaning": "Reasonable Due Diligence Date."}, {"code": "HUD", "full": "Housing Urban Development", "meaning": "Housing Urban Development."}, {"code": "HOA", "full": "Homeowners Association", "meaning": "Homeowners Association."}, {"code": "RFDD", "full": "Referral Due Date", "meaning": "Referral Due Date."}, {"code": "DIL", "full": "Deed In Lieu", "meaning": "Deed In Lieu."}, {"code": "SS", "full": "Short Sale", "meaning": "Short Sale."}, {"code": "ML", "full": "Mortgage Letter", "meaning": "Mortgage Letter."}, {"code": "FC", "full": "Foreclosure", "meaning": "Foreclosure â the legal process of recovering a loan balance through sale of the property."}, {"code": "PIF", "full": "Paid In Full", "meaning": "Paid In Full."}, {"code": "T&I", "full": "Tax and Insurance", "meaning": "Tax and Insurance â two of the four PITI components."}, {"code": "NBS", "full": "Non-Borrowing Spouse", "meaning": "Non-Borrowing Spouse."}, {"code": "DOD", "full": "Date of Death", "meaning": "Date of Death."}, {"code": "RPP", "full": "Repayment Plan", "meaning": "Repayment Plan."}, {"code": "BK", "full": "Bankruptcy", "meaning": "Bankruptcy â a legal proceeding for a borrower unable to repay debts."}, {"code": "DOT", "full": "Deed of Trust", "meaning": "Deed of Trust â the mortgage document establishing the borrower-lender relationship."}, {"code": "PITI", "full": "Principal, Interest, Taxes, Insurance", "meaning": "The four components that make up an EMI."}, {"code": "SSN", "full": "Social Security Number", "meaning": "A 9-digit identifier for U.S. citizens/residents used to track income and benefits."}, {"code": "BPO", "full": "Broker Price Opinion", "meaning": "An estimate of a property's value used instead of a full appraisal, common in foreclosure."}, {"code": "EMI", "full": "Equated Monthly Installment", "meaning": "The fixed monthly payment a borrower makes to repay a home loan."}, {"code": "ARM", "full": "Adjustable-Rate Mortgage", "meaning": "A mortgage whose interest rate changes periodically with the market."}, {"code": "HELOC", "full": "Home Equity Line of Credit", "meaning": "A variable-rate, credit-card-like loan against home equity."}, {"code": "VA", "full": "Department of Veterans Affairs", "meaning": "Guarantees a portion of VA loans for eligible veterans and service members."}, {"code": "FHA", "full": "Federal Housing Administration", "meaning": "Insures FHA loans, helping borrowers with limited savings or modest credit qualify."}, {"code": "AOM", "full": "Assignment of Mortgage", "meaning": "Transfers the loan seller's mortgage rights (including foreclosure rights) to a new loan owner."}, {"code": "DTI", "full": "Debt-to-Income Ratio", "meaning": "The ratio of a borrower's monthly debt payments to monthly income, used in underwriting."}, {"code": "UFMIP", "full": "Upfront Mortgage Insurance Premium", "meaning": "A one-time FHA premium, often financed into the loan."}, {"code": "MIP", "full": "Mortgage Insurance Premium", "meaning": "The monthly FHA mortgage insurance payment."}, {"code": "1003", "full": "Uniform Residential Loan Application", "meaning": "The standard mortgage application form (or its equivalent, Form 65)."}]};
const state = JSON.parse(localStorage.getItem("mortgagePrep") || '{"attempts":[],"mistakes":[],"bookmarks":[],"completed":[],"mockResults":[]}');
let page="dashboard", currentTopic=null, quiz=null, selected=null, submitted=false, flashDeck=[], flashIndex=0, flashFlip=false;

function save(){localStorage.setItem("mortgagePrep",JSON.stringify(state))}
function pct(a,b){return b?Math.round(a/b*100):0}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function topic(id){return DATA.topics.find(x=>x.id===id)}
function allDefs(){return DATA.topics.flatMap(t=>t.concepts.map((c,i)=>({...c,id:t.id+"-"+i,topicId:t.id,topicTitle:t.title})))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nav(){
 const items=[["dashboard","Dashboard"],["learn","Learn"],["practice","Practice"],["shortforms","Short Forms"],["mock","Mock Test"],["mistakes","Review Mistakes"]];
 document.getElementById("nav").innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");
 document.getElementById("crumb").textContent=items.find(x=>x[0]===page)?.[1]||"Training";
}
function go(p){page=p;currentTopic=null;quiz=null;selected=null;submitted=false;render();scrollTo(0,0)}
function toggleNav(){document.querySelector(".sidebar").style.display=document.querySelector(".sidebar").style.display==="block"?"none":"block"}
function render(){nav();let f={dashboard:dashboard,learn:learn,practice:practice,shortforms:shortforms,mock:mock,mistakes:mistakes}[page];document.getElementById("app").innerHTML=f()}
function dashboard(){
 const attempts=state.attempts.length, correct=state.attempts.filter(x=>x.correct).length, done=state.completed.length;
 return `<div class="title"><h1>Mortgage Training & Test Preparation</h1><p>Study the training material, practice every concept, and prepare for the assessment.</p></div>
 <div class="grid">
 <div class="card"><div class="muted">Questions Attempted</div><div class="metric">${attempts}</div></div>
 <div class="card"><div class="muted">Overall Accuracy</div><div class="metric">${pct(correct,attempts)}%</div></div>
 <div class="card"><div class="muted">Topics Completed</div><div class="metric">${done}/${DATA.topics.length}</div></div>
 </div>
 <div class="grid2" style="margin-top:16px">
 <div class="card"><div class="section-head"><div><b>Continue Learning</b><div class="muted">Work through the training notes topic by topic.</div></div></div><div class="actions"><button class="btn primary" onclick="go('learn')">Open Study Material</button><button class="btn" onclick="go('practice')">Practice Questions</button></div></div>
 <div class="card"><div class="section-head"><div><b>Quick Revision</b><div class="muted">Definitions, abbreviations and mistakes.</div></div></div><div class="actions"><button class="btn" onclick="go('shortforms')">Short Forms</button><button class="btn" onclick="go('mistakes')">Review Mistakes</button></div></div>
 </div>
 <div class="card" style="margin-top:16px"><div class="section-head"><b>Topic Progress</b></div>
 ${DATA.topics.map(t=>{let a=state.attempts.filter(x=>x.topicId===t.id),c=a.filter(x=>x.correct).length;return `<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(t.title)}</span><span>${pct(c,a.length)}%</span></div><div class="progress"><i style="width:${pct(c,a.length)}%"></i></div></div>`}).join("")}</div>`;
}
function learn(){
 if(currentTopic)return topicView(topic(currentTopic));
 return `<div class="title"><h1>Study Material</h1><p>All concepts are organized from the supplied training material.</p></div><input class="search" id="learnSearch" placeholder="Search topics, terms or definitions..." oninput="filterTopics(this.value)">
 <div id="topicList" class="grid2">${DATA.topics.map(t=>topicCard(t)).join("")}</div>`;
}
function topicCard(t){return `<div class="card topic" data-search="${esc((t.title+" "+t.overview+" "+t.concepts.map(c=>c.term+" "+c.definition).join(" ")).toLowerCase())}"><h3>${esc(t.title)}</h3><p>${esc(t.overview)}</p><span class="pill">${t.concepts.length} concepts</span> <button class="btn" style="float:right;padding:6px 9px" onclick="openTopic('${t.id}')">Study</button></div>`}
function filterTopics(q){q=q.toLowerCase();document.querySelectorAll("#topicList .topic").forEach(x=>x.style.display=x.dataset.search.includes(q)?"block":"none")}
function openTopic(id){currentTopic=id;render()}
function topicView(t){return `<div class="section-head"><div><h1 style="margin:0">${esc(t.title)}</h1><p class="muted">${esc(t.overview)}</p></div><button class="btn" onclick="currentTopic=null;render()">← All Topics</button></div>
<div class="card"><h3>Concepts & Definitions</h3>${t.concepts.map(c=>`<div class="definition"><b>${esc(c.term)}</b><span>${esc(c.definition)}</span></div>`).join("")}
${t.keyPoints?.length?`<h3>Key Points</h3><ul>${t.keyPoints.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${t.remember?`<div class="feedback" style="background:#f3f7fb;color:#334e68"><b>Remember:</b> ${esc(t.remember)}</div>`:""}</div>
<div class="actions" style="margin-top:14px"><button class="btn primary" onclick="startTopicQuiz('${t.id}')">Practice This Topic</button><button class="btn" onclick="startDefinitionQuiz('${t.id}')">Definition Practice</button></div>`}
function practice(){
 if(quiz)return quizView();
 return `<div class="title"><h1>Practice Questions</h1><p>Practice topic-by-topic or across the full syllabus.</p></div>
 <div class="grid2">${DATA.topics.map(t=>`<div class="card topic"><h3>${esc(t.title)}</h3><p>${t.concepts.length} concepts covered.</p><div class="actions"><button class="btn primary" onclick="startTopicQuiz('${t.id}')">Practice Topic</button><button class="btn" onclick="startDefinitionQuiz('${t.id}')">Definitions</button></div></div>`).join("")}</div>
 <div class="card" style="margin-top:16px"><h3>Mixed Practice</h3><p class="muted">Random questions covering the complete syllabus.</p><button class="btn primary" onclick="startMixed()">Start Mixed Practice</button></div>`;
}
function mkQuestion(question,options,answer,explanation,topicId){return {question,options,answerIndex:answer,explanation,topicId,id:"q-"+Math.random().toString(36).slice(2)}}
function startTopicQuiz(id){let base=DATA.topics.find(t=>t.id===id);let qs=[];base.concepts.forEach((c)=>{let wrong=shuffle(allDefs().filter(d=>d.term!==c.term)).slice(0,3).map(d=>d.definition);let opts=shuffle([c.definition,...wrong]);qs.push(mkQuestion(`What is the definition of "${c.term}"?`,opts,opts.indexOf(c.definition),`${c.term}: ${c.definition}`,id))});quiz={title:base.title,queue:shuffle(qs),i:0,results:[]};selected=null;submitted=false;render()}
function startDefinitionQuiz(id){let defs=allDefs().filter(d=>d.topicId===id);let qs=defs.map(d=>{let wrong=shuffle(allDefs().filter(x=>x.id!==d.id)).slice(0,3).map(x=>x.term);let opts=shuffle([d.term,...wrong]);return mkQuestion(`Which term matches this definition?\\n"${d.definition}"`,opts,opts.indexOf(d.term),`${d.term}: ${d.definition}`,id)});quiz={title:"Definition Practice",queue:shuffle(qs),i:0,results:[]};selected=null;submitted=false;render()}
function startMixed(){let qs=[];DATA.topics.forEach(t=>t.concepts.forEach(c=>{let wrong=shuffle(allDefs().filter(d=>d.term!==c.term)).slice(0,3).map(d=>d.term);let opts=shuffle([c.term,...wrong]);qs.push(mkQuestion(`Which term is described by this definition?\\n"${c.definition}"`,opts,opts.indexOf(c.term),`${c.term}: ${c.definition}`,t.id))}));quiz={title:"Mixed Practice",queue:shuffle(qs).slice(0,25),i:0,results:[]};selected=null;submitted=false;render()}
function quizView(){
 if(quiz.i>=quiz.queue.length)return summary();
 let q=quiz.queue[quiz.i], answered=selected!==null;
 return `<div class="section-head"><div><h1 style="margin:0">${esc(quiz.title)}</h1><div class="muted">Question ${quiz.i+1} of ${quiz.queue.length}</div></div><button class="btn" onclick="quiz=null;render()">Exit</button></div>
 <div class="progress"><i style="width:${pct(quiz.i,quiz.queue.length)}%"></i></div>
 <div class="card" style="margin-top:14px"><span class="pill">${esc(topic(q.topicId)?.title||"Training")}</span><div class="question">${esc(q.question)}</div>
 ${q.options.map((o,i)=>`<button class="option ${submitted?(i===q.answerIndex?"correct":(i===selected?"wrong":"")):(i===selected?"selected":"")}" ${submitted?"disabled":""} onclick="selectOpt(${i})">${esc(o)} ${submitted&&i===q.answerIndex?" ✓":""}</button>`).join("")}
 ${submitted?`<div class="feedback ${selected===q.answerIndex?"ok":"bad"}"><b>${selected===q.answerIndex?"Correct":"Not quite"}</b><br>${esc(q.explanation)}</div>`:""}
 <div class="actions" style="justify-content:flex-end;margin-top:15px">${!submitted?`<button class="btn primary" ${selected===null?"disabled":""} onclick="checkAnswer()">Check Answer</button>`:`<button class="btn primary" onclick="nextQ()">${quiz.i+1===quiz.queue.length?"Finish":"Next Question"}</button>`}</div></div>`;
}
function selectOpt(i){if(!submitted){selected=i;render()}}
function checkAnswer(){if(selected===null)return;submitted=true;let q=quiz.queue[quiz.i],correct=selected===q.answerIndex;quiz.results.push({q,correct});state.attempts.push({qId:q.id,topicId:q.topicId,correct});if(!correct&&!state.mistakes.some(x=>x.question===q.question))state.mistakes.push(q);save();render()}
function nextQ(){quiz.i++;selected=null;submitted=false;render()}
function summary(){let c=quiz.results.filter(x=>x.correct).length,total=quiz.results.length;return `<div class="card" style="text-align:center"><div class="muted">${esc(quiz.title)} complete</div><div class="metric">${pct(c,total)}%</div><p>${c} of ${total} correct</p><div class="actions" style="justify-content:center"><button class="btn primary" onclick="quiz=null;render()">Back to Practice</button></div></div>`}
function shortforms(){
 let q=window.sfQuery||"";let arr=DATA.abbreviations.filter(a=>(a.code+" "+a.full+" "+a.meaning).toLowerCase().includes(q.toLowerCase()));
 return `<div class="title"><h1>Mortgage Short Forms</h1><p>Search and practice the abbreviations from the training material.</p></div>
 <input class="search" placeholder="Search abbreviation or full form..." value="${esc(q)}" oninput="window.sfQuery=this.value;render()">
 <div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="startAbbrQuiz('code2full')">Abbreviation → Full Form</button><button class="btn" onclick="startAbbrQuiz('full2code')">Full Form → Abbreviation</button><button class="btn" onclick="startAbbrQuiz('meaning')">Meaning → Abbreviation</button></div>
 <div class="card"><table class="table"><thead><tr><th>Short Form</th><th>Full Form</th><th>Meaning</th></tr></thead><tbody>${arr.map(a=>`<tr><td><b>${esc(a.code)}</b></td><td>${esc(a.full)}</td><td>${esc(a.meaning)}</td></tr>`).join("")}</tbody></table></div>`;
}
function startAbbrQuiz(dir){let qs=DATA.abbreviations.map(a=>{let correct=dir==="code2full"?a.full:a.code;let wrong=shuffle(DATA.abbreviations.filter(x=>x.code!==a.code)).slice(0,3).map(x=>dir==="code2full"?x.full:x.code);let question=dir==="code2full"?`What does "${a.code}" stand for?`:dir==="full2code"?`What is the abbreviation for "${a.full}"?`:`Which abbreviation matches this meaning?\\n"${a.meaning}"`;let opts=shuffle([correct,...wrong]);return mkQuestion(question,opts,opts.indexOf(correct),`${a.code} = ${a.full}`,null)});quiz={title:"Short Forms Practice",queue:shuffle(qs),i:0,results:[]};selected=null;submitted=false;render()}
function mock(){
 return `<div class="title"><h1>Mock Test</h1><p>A focused assessment using the supplied training material.</p></div><div class="card"><h3>Start Mock Test</h3><p class="muted">25 randomly selected questions from across the syllabus.</p><button class="btn primary" onclick="startMixed()">Start 25-Question Mock Test</button></div>`;
}
function mistakes(){
 if(!state.mistakes.length)return `<div class="title"><h1>Review Mistakes</h1></div><div class="empty">No mistakes yet. Complete a practice session to build your review list.</div>`;
 return `<div class="title"><h1>Review Mistakes</h1><p>Questions you previously answered incorrectly.</p></div><div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="quiz={title:'Mistake Review',queue:shuffle(state.mistakes),i:0,results:[]};selected=null;submitted=false;render()">Practice All Mistakes</button></div><div class="card">${state.mistakes.map((q,i)=>`<div class="definition"><b>${i+1}. ${esc(q.question)}</b><div class="muted">${esc(topic(q.topicId)?.title||"Training")}</div><p>${esc(q.explanation)}</p></div>`).join("")}</div>`;
}
render();
</script>
</body>
</html>
